<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="shortcut icon" href="images/budget.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <nav class="navbar">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
          <img src="images/budget.png" alt="Logo" class="d-inline-block align-text-top">
          Expense Tracker
        </a>
      </div>
      <div class="darkMode">
        <button id="themeToggle" class="btn"><i class="fa-regular fa-moon"></i></button>
      </div>
    </nav>
  </header>

  <main>

    <div id="alert-container"></div>

    <div class="Summary-card">
      <h3>Summary Cards</h3>
      <div class="cards">
        <div class="cardd">
          <h4>Total Amount</h4>
          <p class="total-amount"></p>
        </div>
        <div class="cardd">
          <h4>Total Expenses Count</h4>
          <p class="total-count"></p>
        </div>
        <div class="cardd">
          <h4>Highest Expense</h4>
          <p class="highest-amount"></p>
        </div>
      </div>
    </div>

    <div id="editForm" class="form">
      <h3 id="h3-add">Add Expense</h3>
      <form id="expense-form">

        <div class="form-group">
          <label for="expense-title">Title</label>
          <input placeholder="title expense..." type="text" id="expense-title" required>
        </div>

        <div class="form-group">
          <label for="expense-amount">Amount</label>
          <input type="number" min="0" placeholder="amount expense..." id="expense-amount" required>
        </div>

        <div class="form-group category">
          <label for="expense-category">Category</label>
          <select id="expense-category" class="form-selected" required>
            <option value="" disabled selected>category expense...</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="expense-date">Date</label>
          <input type="date" id="expense-date"
            onchange="this.style.color = this.value ? '#8d7555' : 'var(--text-muted);'">
        </div>
        <button id="btn-add-expense" class="btn-form" type="submit">Add Expense</button>
        <!-- <div id="form-error-msg" style="color: red; font-size: 14px; margin-bottom: 10px; display: none;"></div> -->
      </form>
    </div>

    <div id="loading-spinner" class="text-center my-3 d-none">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div class="expense">
      <div class="hTable">
        <h3>Expense</h3>
        <div class="dropdown">
          <!-- <h5>Category</h5> -->
          <a class="dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            filtter category
          </a>

          <ul class="dropdown-menu">
            <li class="dropdown-item filter">Food</li>
            <li class="dropdown-item filter">Transport</li>
            <li class="dropdown-item filter">Bills</li>
            <li class="dropdown-item filter">Entertainment</li>
            <li class="dropdown-item filter">Other</li>
            <li class="dropdown-item filter">All Categories</li>
          </ul>

          <button id="export-csv-btn" class="btn btn-success mb-3">
            <i class="fa-solid fa-file-csv"></i> Export CSV
          </button>
        </div>
      </div>
      <div class="search">
        <input type="text" id="searchInput" class="search-box" onkeyup="searchTable()" placeholder="Search..." />
      </div>
      <div class="table-expense">
        <table id="myTable" class="table">
          <thead>
            <tr>
              <th onclick="sortTable(0)" scope="col">Title</th>
              <th onclick="sortTable(1)" scope="col">Amount</th>
              <th onclick="sortTable(2)" scope="col">Category</th>
              <th onclick="sortTable(3)" scope="col">Date</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody class="expenseTableBody">

          </tbody>
        </table>
      </div>
    </div>

    <div class="chart">
      <div>
        <h3>Display Chart</h3>
      </div>
      <div class="chart_types mb-3">
        <button class="btn btnChart" onclick="setChartType('bar')">Bars</button>
        <button class="btn btnChart" onclick="setChartType('line')">Line</button>
        <button class="btn btnChart" onclick="setChartType('doughnut')">Doughnut</button>
        <button class="btn btnChart" onclick="setChartType('polarArea')">PolarArea</button>
        <button class="btn btnChart" onclick="setChartType('radar')">Radar</button>
      </div>
      <div style="position: relative;height:300px;width:100%;display: grid;justify-content: center;">
        <canvas id="myChart"></canvas>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://kit.fontawesome.com/d8e34f1027.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
